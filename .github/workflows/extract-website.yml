name: Extract Filtbo Website

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract website
        run: |
          mkdir extracted-site
          unzip -q filtbo-site.zip -d extracted-site
          cp -a extracted-site/. .
          rm -rf extracted-site filtbo-site.zip

      - name: Save website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Filtbo website files"
          git push
